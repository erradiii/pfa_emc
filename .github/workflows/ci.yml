name: EMC CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - partn
      - main

  pull_request:
    branches:
      - main


jobs:

  test-and-build:
    runs-on: ubuntu-latest


    # ==============================
    # PostgreSQL for Django tests
    # ==============================

    services:
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_DB: emc_db
          POSTGRES_USER: emc_user
          POSTGRES_PASSWORD: emc_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U emc_user -d emc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      # ==============================
      # Download project
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==============================
      # Backend
      # ==============================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt


      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt


      - name: Run Django migrations
        working-directory: backend

        env:
          DB_NAME: emc_db
          DB_USER: emc_user
          DB_PASSWORD: emc_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: 0
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

        run: python manage.py migrate


      - name: Check Django
        working-directory: backend

        env:
          DB_NAME: emc_db
          DB_USER: emc_user
          DB_PASSWORD: emc_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: 0
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

        run: python manage.py check


      - name: Run Django tests
        working-directory: backend

        env:
          DB_NAME: emc_db
          DB_USER: emc_user
          DB_PASSWORD: emc_password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: 0
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

        run: python manage.py test


      # ==============================
      # Frontend
      # ==============================

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Build React frontend
        working-directory: frontend

        env:
          VITE_API_URL: /api

        run: npm run build


      # ==============================
      # Docker
      # ==============================

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t emc-backend-ci \
            ./backend


      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL=/api \
            -t emc-frontend-ci \
            ./frontend


      # ==============================
      # GitHub Container Registry
      # ==============================

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin


      - name: Tag backend Docker image
        if: github.event_name == 'push'
        run: |
          docker tag emc-backend-ci \
            ghcr.io/erradiii/emc-backend:${{ github.sha }}

          docker tag emc-backend-ci \
            ghcr.io/erradiii/emc-backend:${{ github.ref_name }}


      - name: Tag frontend Docker image
        if: github.event_name == 'push'
        run: |
          docker tag emc-frontend-ci \
            ghcr.io/erradiii/emc-frontend:${{ github.sha }}

          docker tag emc-frontend-ci \
            ghcr.io/erradiii/emc-frontend:${{ github.ref_name }}


      - name: Push backend Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/erradiii/emc-backend:${{ github.sha }}
          docker push ghcr.io/erradiii/emc-backend:${{ github.ref_name }}


      - name: Push frontend Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/erradiii/emc-frontend:${{ github.sha }}
          docker push ghcr.io/erradiii/emc-frontend:${{ github.ref_name }}