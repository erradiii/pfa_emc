services:

  db:
    image: postgres:15-alpine
    container_name: emc_postgres_prod

    env_file:
      - .env.prod

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emc_user -d emc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: emc_backend_prod

    env_file:
      - .env.prod

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn core_crm.wsgi:application --bind 0.0.0.0:8000"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

      args:
        VITE_API_URL: /api

    container_name: emc_frontend_prod

    ports:
      - "8080:80"

    depends_on:
      - backend

    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro

    restart: unless-stopped


volumes:
  postgres_data_prod:
  static_data:
  media_data: